[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitegen"
version = "0.1.0"
description = "Generate a starter Astro website for a local business from a YAML file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sitegen = "sitegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitegen = ["templates/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
